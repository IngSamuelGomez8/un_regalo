<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxia floral</title>
<style>
:root{--bg:#04030a;--ink:#f3e9ff;--mute:#a99cc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04030a;--ink:#f3e9ff;--mute:#a99cc4}}
:root[data-theme="dark"]{--bg:#04030a;--ink:#f3e9ff;--mute:#a99cc4}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.t{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;pointer-events:none;padding:0 20px}
h1{margin:0;font-weight:300;font-size:clamp(2rem,7vw,4rem);letter-spacing:.04em;text-shadow:0 0 30px rgba(190,140,255,.6)}
p{margin:8px 0 0;font-size:clamp(1rem,2.6vw,1.25rem);color:var(--mute);font-style:italic}
</style>
</head>
<body>
<canvas id="c" aria-label="Galaxia espiral formada por flores luminosas"></canvas>
<div class="t"><h1>Galaxia floral</h1><p>Mil flores giran alrededor de una estrella (tú).</p><p class="g">Y feliz grado por adelantado</p></div>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,R,cx,cy;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tiltT=1.0,tilt=1.0,rollT=-0.35,roll=-0.35;
function rnd(){return Math.random()}
function gauss(){return (rnd()+rnd()+rnd()+rnd()-2)/2}
const hues=[320,285,265,215,190,350,45];
function flowerSprite(h){
  const s=128,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  g.translate(s/2,s/2);
  const glow=g.createRadialGradient(0,0,4,0,0,62);
  glow.addColorStop(0,`hsla(${h},90%,70%,.55)`);glow.addColorStop(1,`hsla(${h},90%,60%,0)`);
  g.fillStyle=glow;g.beginPath();g.arc(0,0,62,0,7);g.fill();
  const n=5+Math.floor(rnd()*3);
  for(let layer=0;layer<2;layer++){
    const len=layer?30:44,wd=layer?11:17;
    for(let i=0;i<n;i++){
      g.save();g.rotate(i*Math.PI*2/n+layer*Math.PI/n);
      const p=g.createLinearGradient(0,0,len,0);
      p.addColorStop(0,`hsl(${h+20},90%,${layer?85:60}%)`);
      p.addColorStop(.55,`hsl(${h},85%,${layer?72:68}%)`);
      p.addColorStop(1,`hsl(${h-15},95%,${layer?92:82}%)`);
      g.fillStyle=p;g.beginPath();
      g.moveTo(3,0);g.bezierCurveTo(len*.3,-wd*1.3,len*.85,-wd,len,0);
      g.bezierCurveTo(len*.85,wd,len*.3,wd*1.3,3,0);g.fill();
      g.strokeStyle=`hsla(${h},60%,95%,.35)`;g.lineWidth=.8;
      g.beginPath();g.moveTo(5,0);g.lineTo(len*.8,0);g.stroke();
      g.restore();
    }
  }
  const ce=g.createRadialGradient(0,0,0,0,0,9);
  ce.addColorStop(0,'#fff8d0');ce.addColorStop(.5,'#ffd25a');ce.addColorStop(1,'rgba(255,160,40,0)');
  g.fillStyle=ce;g.beginPath();g.arc(0,0,9,0,7);g.fill();
  return c;
}
const sprites=hues.map(flowerSprite);
let stars=[],flowers=[],bg=[];
const ARMS=4,WIND=4.6;
function build(){
  stars=[];flowers=[];bg=[];
  for(let i=0;i<3200;i++){
    const r=Math.min(1,-Math.log(1-rnd()*.985)*.3);
    const arm=Math.floor(rnd()*ARMS);
    const spread=.12+r*.5;
    const a=arm*Math.PI*2/ARMS+r*WIND+gauss()*spread*2.2;
    stars.push({r,a,z:gauss()*.04*(1-r*.5),s:rnd()*1.4+.4,h:r<.25?40+rnd()*15:r<.6?270+rnd()*50:200+rnd()*40,l:60+rnd()*35,tw:rnd()*7});
  }
  for(let i=0;i<340;i++){
    const r=.1+Math.pow(rnd(),.8)*.9;
    const arm=Math.floor(rnd()*ARMS);
    const a=arm*Math.PI*2/ARMS+r*WIND+gauss()*(.1+r*.22);
    flowers.push({r,a,z:gauss()*.03,sz:.5+rnd()*.9,rot:rnd()*6.28,spin:(rnd()-.5)*.6,sp:Math.floor(rnd()*sprites.length),al:.65+rnd()*.35});
  }
  for(let i=0;i<500;i++)bg.push({x:rnd(),y:rnd(),s:rnd()*1.2+.2,tw:rnd()*7});
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  R=Math.min(W,H)*(W<H?.48:.4);cx=W/2;cy=H*(W<H?.42:.46);
}
addEventListener('resize',resize);resize();build();
function onMove(x,y){tiltT=.55+(y/H)*.9;rollT=-.35+((x/W)-.5)*.9}
addEventListener('pointermove',e=>onMove(e.clientX,e.clientY));
addEventListener('pointerdown',e=>onMove(e.clientX,e.clientY));
function omega(r){return .22/(r+.18)}
function proj(r,a,z,t){
  const ang=a-t*omega(r)*.25;
  let x=Math.cos(ang)*r,y=Math.sin(ang)*r;
  const ct=Math.cos(tilt),st=Math.sin(tilt);
  const y2=y*ct+z*st,d=y*st-z*ct;
  const cr=Math.cos(roll),sr=Math.sin(roll);
  return {x:cx+(x*cr-y2*sr)*R,y:cy+(x*sr+y2*cr)*R,d};
}
let t0=performance.now();
function frame(now){
  const t=reduce?0:(now-t0)/1000;
  tilt+=(tiltT-tilt)*.05;roll+=(rollT-roll)*.05;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#04030a';ctx.fillRect(0,0,W,H);
  const nb=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.5);
  nb.addColorStop(0,'rgba(90,40,140,.35)');nb.addColorStop(.5,'rgba(40,20,90,.22)');nb.addColorStop(1,'rgba(4,3,10,0)');
  ctx.fillStyle=nb;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const b of bg){
    const a=.35+.35*Math.sin(t*1.5+b.tw);
    ctx.fillStyle=`rgba(210,200,255,${a})`;ctx.fillRect(b.x*W,b.y*H,b.s,b.s);
  }
  // halo de las espirales
  for(let k=0;k<ARMS;k++){
    for(let r=.12;r<1;r+=.03){
      const p=proj(r,k*Math.PI*2/ARMS+r*WIND,0,t);
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*.14);
      g.addColorStop(0,`hsla(${290-r*70},80%,55%,${.07*(1-r*.6)})`);g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(p.x-R*.14,p.y-R*.14,R*.28,R*.28);
    }
  }
  for(const s of stars){
    const p=proj(s.r,s.a,s.z,t);
    const a=(.35+.5*Math.sin(t*2+s.tw))*(1-s.r*.45);
    ctx.fillStyle=`hsla(${s.h},80%,${s.l}%,${a})`;
    ctx.fillRect(p.x,p.y,s.s,s.s);
  }
  // núcleo
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.34);
  cg.addColorStop(0,'rgba(255,248,220,1)');cg.addColorStop(.12,'rgba(255,210,140,.85)');
  cg.addColorStop(.4,'rgba(255,150,170,.3)');cg.addColorStop(1,'rgba(120,60,200,0)');
  ctx.save();ctx.translate(cx,cy);ctx.rotate(roll);ctx.scale(1,Math.max(.35,Math.cos(tilt)*.5+.5));ctx.translate(-cx,-cy);
  ctx.fillStyle=cg;ctx.fillRect(cx-R*.4,cy-R*.4,R*.8,R*.8);ctx.restore();
  // flores
  ctx.globalCompositeOperation='source-over';
  const list=flowers.map(f=>({f,p:proj(f.r,f.a,f.z,t)})).sort((u,v)=>u.p.d-v.p.d);
  for(const {f,p} of list){
    const persp=1+p.d*.25;
    const size=(R*.09)*f.sz*persp*(1-f.r*.35);
    ctx.save();ctx.translate(p.x,p.y);
    ctx.rotate(f.rot+t*f.spin);
    ctx.scale(1,.55+.45*Math.cos(tilt));
    ctx.globalAlpha=f.al*(.55+.45*Math.min(1,persp));
    ctx.drawImage(sprites[f.sp],-size,-size,size*2,size*2);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
